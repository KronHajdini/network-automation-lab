# ==========================================================
# FortiGate Hardening & Security Profile Configuration
# Description: Restricts management access to admin subnets,
#              applies L7 UTM inspection, and enables full logging.
# ==========================================================

# 1. Restrict Management Access (Local-In Policy)
config firewall address
    edit "NET_ADMIN_SUBNET"
        set subnet 10.10.99.0 255.255.255.0
    next
end

config firewall local-in-policy
    edit 1
        set intf "port1"
        set srcaddr "NET_ADMIN_SUBNET"
        set dstaddr "all"
        set action accept
        set service "HTTPS" "SSH"
        set schedule "always"
    next
    edit 2
        set intf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action drop
        set service "HTTPS" "SSH"
        set schedule "always"
    next
end

# 2. Strict Outbound Firewall Policy with Deep Security Profiles
config firewall policy
    edit 201
        set name "LAN-to-WAN-Restricted"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set utm-status enable
        set ssl-ssh-profile "deep-inspection"
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set application-list "default"
        set logtraffic all
    next
end

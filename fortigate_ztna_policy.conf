# ==========================================================
# FortiGate CLI Script: ZTNA Server & Access Policy Setup
# Description: Defines a ZTNA Access Proxy for secure internal 
#              web application access based on device posture tags.
# ==========================================================

# Step 1: Define ZTNA VIP/Server (Proxy)
config firewall vip
    edit "ZTNA-WebApp-Proxy"
        set type access-proxy
        set extip 198.51.100.10
        set extintf "port1"
        set extport 443
    next
end

# Step 2: Configure ZTNA Access Proxy Details
config firewall access-proxy
    edit "ZTNA-WebApp-Proxy"
        config api-gateway
            edit 1
                set url-map "/app"
                set service http
                config realserver
                    edit 1
                        set ip 10.10.20.50
                        set port 80
                    next
                end
            next
        end
    next
end

# Step 3: Enforce ZTNA Firewall Access Policy with Posture Check
config firewall policy
    edit 101
        set name "ZTNA-Strict-Corporate-Access"
        set srcintf "any"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "ZTNA-WebApp-Proxy"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set ztna-ems-tag "EMS_Tag_Compliant_Corporate_PC"
        set logtraffic all
    next
end
